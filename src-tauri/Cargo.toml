[package]
name = "hl-desk"
version = "0.1.10"
description = "HL Desk: clipboard history, screenshots and notes in the menu bar"
edition = "2021"
publish = false

[lib]
name = "hl_desk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-fs = "2.7"
# Drag a file out of the window into another app (CrabNebula, macOS + Windows).
tauri-plugin-drag = "2.1"
# One running copy; a second launch focuses it, or with --capture starts a capture.
tauri-plugin-single-instance = "2.5"
# Open at login (LaunchAgent on macOS, HKCU Run key on Windows); see settings.rs.
tauri-plugin-autostart = "2.7"
# Auto-update from the public releases repo (config: tauri.conf.json plugins.updater; UI: src/updater.ts),
# and the process plugin to relaunch after installing an update.
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local store: one SQLite file per feature in the app data folder (see db.rs).
rusqlite = { version = "0.41", features = ["bundled"] }
# Screen capture (Tauri has no official plugin for it).
xcap = "0.9"
# Translation model downloads (translate.rs): the same reqwest and rustls (ring) set-up as
# tauri-plugin-updater, plus sha256 to check every file against the pinned manifest.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
# A second request for a pair that is already downloading waits for the same result (translate.rs).
tokio = { version = "1", default-features = false, features = ["sync"] }

# macOS pasteboard access for the clipboard feature: changeCount polling and skipping
# org.nspasteboard.ConcealedType (password managers). NSEvent, NSScreen, NSWindow: the translate
# card goes on the screen under the pointer and comes up without taking the focus (translate.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL", "NSData", "NSDictionary", "NSError"] }
# Text recognition (ocr.rs): Vision's VNRecognizeTextRequest.
objc2-vision = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSResponder", "NSEvent", "NSScreen", "NSWindow", "objc2-core-foundation"] }

# Windows clipboard formats for the clipboard feature: skip copies marked private
# (ExcludeClipboardContentFromMonitorProcessing, Clipboard Viewer Ignore, CanIncludeInClipboardHistory = 0).
# WindowsAndMessaging: show the screenshot toast on top without taking the focus (SetWindowPos).
# Threading: the clipboard owner's process name (device screenshot only from the snipping tool).
# LibraryLoader: the translate clipboard listener's message-only window (translate.rs).
# Storage_FileSystem: GetDriveTypeW, so copied files on a mapped network drive are not looked up.
# SystemInformation: GetLogicalProcessorInformation, the physical core count for whisper (voice.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Text recognition (ocr.rs): Windows.Media.Ocr (same windows version as already in Cargo.lock).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "System_UserProfile"] }
windows-future = "0.3"
# Offline voice to text (voice.rs, Windows only): whisper.cpp built from source with cmake
# (whisper-rs: Unlicense; whisper.cpp: MIT) and the default microphone through cpal (Apache-2.0).
# raw-api: the C callback types used to time the encoder and decoder.
whisper-rs = { version = "0.16", features = ["raw-api"] }
cpal = "0.18"

[target.'cfg(windows)'.dev-dependencies]
# Reads the voice test fixture (voice.rs tests).
hound = "3.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
