<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot</title>
  </head>
  <body>
    <header class="bar">
      <div class="group" role="toolbar" aria-label="Tools">
        <button class="tool" data-tool="number" title="Number (N)">① Number</button>
        <button class="tool" data-tool="pen" title="Pen (P)">✎ Pen</button>
        <button class="tool" data-tool="crop" title="Crop (C)">⛶ Crop</button>
      </div>
      <div class="group" role="radiogroup" aria-label="Colour">
        <button class="swatch" data-color="#2F4CC8" title="Indigo" style="--c: #2f4cc8"></button>
        <button class="swatch" data-color="#E5484D" title="Red" style="--c: #e5484d"></button>
        <button class="swatch" data-color="#0B1220" title="Ink" style="--c: #0b1220"></button>
      </div>
      <div class="group">
        <button id="undo" class="plain" title="Undo">↶ Undo</button>
        <button id="redo" class="plain" title="Redo">↷ Redo</button>
      </div>
      <button id="apply-crop" class="plain apply" hidden>Apply crop ↵</button>
    </header>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <span class="pick-tag" id="pick-tag" hidden>Delete to remove</span>
    </div>
    <div class="actions">
      <div class="drag" id="drag" role="button" tabindex="-1" title="Drag into any app to share">
        <img id="drag-thumb" alt="" draggable="false" />
        <span class="drag-text"><strong>Drag to share</strong><span>into WhatsApp, Mail or any app</span></span>
        <svg class="drag-grip" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
          <circle cx="5" cy="3" r="1.2" /><circle cx="9" cy="3" r="1.2" /><circle cx="5" cy="7" r="1.2" />
          <circle cx="9" cy="7" r="1.2" /><circle cx="5" cy="11" r="1.2" /><circle cx="9" cy="11" r="1.2" />
        </svg>
      </div>
      <span id="status" role="status"></span>
      <button id="copy" class="plain">Copy</button>
      <button id="done" class="primary">Done</button>
    </div>
    <footer class="foot">
      <span id="keys"></span>
    </footer>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
