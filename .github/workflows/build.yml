name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (universal, signed + notarized)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Compile first, without signing, so code errors show up even before the secrets exist.
      - name: Compile (universal, no bundle)
        run: npm run tauri -- build --target universal-apple-darwin --no-bundle

      # Rust unit tests on the runner's own architecture (after the compile, so dist/ exists).
      # Includes a real Vision OCR run on src-tauri/tests/fixtures/ocr-sample.png.
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: src-tauri/Cargo.lock
          if-no-files-found: ignore

      - name: Check signing secrets
        env:
          MAC_DEVID_APP_P12: ${{ secrets.MAC_DEVID_APP_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=
          for n in MAC_DEVID_APP_P12 MAC_CERT_PASSWORD ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. No unsigned build is made; set them and re-run."
            exit 1
          fi

      # A keychain of its own for this run (deleted in the last step), used to read the
      # signing identity and to sign the .dmg.
      - name: Read the Developer ID identity
        env:
          MAC_DEVID_APP_P12: ${{ secrets.MAC_DEVID_APP_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/hl-desk.keychain-db"
          kcpass=$(openssl rand -base64 24)
          echo "::add-mask::$kcpass"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          ( umask 077; printf '%s' "$MAC_DEVID_APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12" )
          security import "$RUNNER_TEMP/app.p12" -k "$kc" -f pkcs12 -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "::error::MAC_DEVID_APP_P12 holds no valid Developer ID Application identity"; exit 1; }
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "HL_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          MAC_DEVID_APP_P12: ${{ secrets.MAC_DEVID_APP_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          # Signs the updater bundle (HL Desk.app.tar.gz -> .sig); public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          # The .p8 secret may be the raw key or base64 of it.
          ( umask 077
            if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s\n' "$ASC_KEY_P8" > "$key"
            else
              printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
            fi )
          export APPLE_API_KEY_PATH="$key"
          export APPLE_CERTIFICATE="$(printf '%s' "$MAC_DEVID_APP_P12" | tr -d ' \r\n')"
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

          # Tauri notarizes and staples the .app; sign, notarize and staple the .dmg too.
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"

      - name: Check the .dmg
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/HL Desk.app"
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs=$(lipo -archs "$bin"); echo "archs: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::not universal: $archs"; exit 1;; esac
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$app/Contents/Info.plist"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t exec "$app"
          spctl -a -vv -t open --context context:primary-signature "$dmg"

      # The .dmg (installer) plus the updater bundle and its signature, in one flat folder.
      - name: Collect the .dmg and the updater bundle
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          out="$RUNNER_TEMP/hl-desk-out"
          mkdir -p "$out"
          shopt -s nullglob
          dmgs=("$bundle"/dmg/*.dmg)
          tgzs=("$bundle"/macos/*.app.tar.gz)
          [ ${#dmgs[@]} -eq 1 ] || { echo "::error::expected one .dmg, found ${#dmgs[@]}"; exit 1; }
          [ ${#tgzs[@]} -eq 1 ] || { echo "::error::expected one updater bundle (.app.tar.gz), found ${#tgzs[@]}"; exit 1; }
          [ -s "${tgzs[0]}.sig" ] || { echo "::error::updater signature missing: ${tgzs[0]}.sig (is TAURI_SIGNING_PRIVATE_KEY set?)"; exit 1; }
          cp "${dmgs[0]}" "${tgzs[0]}" "${tgzs[0]}.sig" "$out/"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: HL-Desk-macos-universal
          path: ${{ runner.temp }}/hl-desk-out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Delete the temporary keychain
        if: always()
        run: |
          [ -z "${HL_KEYCHAIN:-}" ] || security delete-keychain "$HL_KEYCHAIN" || true

  windows:
    name: Windows (NSIS installer, unsigned)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # whisper.cpp (voice.rs; whisper-rs-sys passes GGML_* to cmake): not tuned to the runner's
      # CPU, and AVX only (MSVC /arch:AVX), so it runs on Sandy/Ivy Bridge PCs: no AVX2, FMA,
      # BMI2 or AVX512. voice.rs cpu_supported() checks the same at run time. Changing these
      # needs a new rust-cache key below, as whisper-rs-sys does not rebuild on env changes.
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "OFF"
      GGML_FMA: "OFF"
      GGML_F16C: "ON"
      GGML_BMI2: "OFF"
      GGML_AVX512: "OFF"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bump with the GGML_* flags above.
          key: ggml-avx1

      - run: npm ci

      - name: Build
        env:
          # Signs the installer for the updater (-setup.exe -> .sig); public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      # The same -setup.exe is the installer and the updater bundle; its .sig goes next to it.
      - name: Check the installer and its signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ ${#exes[@]} -eq 1 ] || { echo "::error::expected one -setup.exe, found ${#exes[@]}"; exit 1; }
          [ -s "${exes[0]}.sig" ] || { echo "::error::updater signature missing: ${exes[0]}.sig (is TAURI_SIGNING_PRIVATE_KEY set?)"; exit 1; }
          ls -l src-tauri/target/release/bundle/nsis/

      - uses: actions/upload-artifact@v4
        with:
          name: HL-Desk-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # The offline voice model for the voice test (voice.rs), from the pinned URL in voice.rs,
      # checked against its pinned sha256; cached between runs.
      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/whisper-models
          key: whisper-ggml-base.en-a03779c8

      - name: Download the voice model
        shell: bash
        run: |
          set -euo pipefail
          url=$(grep -o 'https://huggingface.co/[^"]*ggml-base.en.bin' src-tauri/src/voice.rs | head -n 1)
          sha=$(grep -A5 'pub const MODEL: ModelFile' src-tauri/src/voice.rs | grep -oE '[0-9a-f]{64}' | head -n 1)
          [ -n "$url" ] && [ -n "$sha" ] || { echo "::error::MODEL_URL or sha256 not found in voice.rs"; exit 1; }
          mkdir -p ~/whisper-models
          f=~/whisper-models/ggml-base.en.bin
          [ -s "$f" ] || curl -fsSL -o "$f" "$url"
          echo "$sha  $f" | sha256sum -c -

      # Rust unit tests (after the build, so ../dist exists for generate_context!), including a
      # real whisper run on src-tauri/tests/fixtures/voice-en.wav.
      - name: Rust unit tests
        shell: bash
        run: |
          export HL_WHISPER_MODELS="$(cygpath -w "$HOME/whisper-models")"
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
