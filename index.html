<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HL Desk</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="popover">
    <header class="app-header" data-tauri-drag-region>
      <span class="wordmark" data-tauri-drag-region>
        <!-- The tray icon's mark, as in the welcome (scripts/make-tray-icons.mjs draws the same shapes). -->
        <svg class="wordmark-logo" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="HL">
          <rect width="16" height="16" rx="3.5" fill="#2F4CC8" />
          <path d="M2 4h2v3h2V4h2v8H6V9H4v3H2zM10 4h2v6h2v2h-4z" fill="#fff" />
        </svg>DESK</span>
      <span class="header-actions">
        <button class="icon-btn" id="translator-open" type="button" aria-label="Translate" title="Translate">
          <!-- Globe icon from Feather (MIT), as the Translate guide rows. -->
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M2 12h20" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg>
        </button>
        <button class="icon-btn" id="guide-open" type="button" aria-label="Guide" title="Guide">
          <!-- Help-circle icon from Feather (MIT). -->
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <path d="M12 17h.01" />
          </svg>
        </button>
        <button class="icon-btn pin-btn" id="pin" type="button" aria-label="Keep HL Desk open"
          title="Keep HL Desk open" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 2h4l-.5 4 2.5 2.5V10H8.6v4h-1.2v-4H4V8.5L6.5 6z" fill="none" stroke="currentColor"
              stroke-width="1.2" stroke-linejoin="round" />
          </svg>
        </button>
        <button class="icon-btn" id="settings-open" type="button" aria-label="Settings"
          aria-haspopup="dialog" aria-expanded="false" aria-controls="settings">
          <!-- Gear icon from Feather (MIT). -->
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </span>
    </header>

    <!-- "Update ready · <version>" card, shown once an update is downloaded (src/updater.ts). -->
    <div class="update-bar" data-update-bar role="status" hidden></div>
    <!-- "Updated to <version> ✓ · What's new", once after an update (src/updater.ts). -->
    <div class="update-bar updated-line" id="updated-line" role="status" hidden></div>

    <nav class="segmented" role="tablist" aria-label="Sections">
      <!-- The selected pill: slides under the chosen tab (main.ts sets --tab). -->
      <span class="segmented-pill" aria-hidden="true"></span>
      <button role="tab" type="button" id="tab-clipboard" data-tab="clipboard" data-icon="clipboard" aria-controls="panel-clipboard" aria-selected="true">Clipboard</button>
      <button role="tab" type="button" id="tab-screenshot" data-tab="screenshot" data-icon="crop" aria-controls="panel-screenshot" aria-selected="false" tabindex="-1">Screenshot</button>
      <button role="tab" type="button" id="tab-notes" data-tab="notes" data-icon="note" aria-controls="panel-notes" aria-selected="false" tabindex="-1">Notes</button>
    </nav>

    <main>
      <section role="tabpanel" id="panel-clipboard" aria-labelledby="tab-clipboard"></section>
      <section role="tabpanel" id="panel-screenshot" aria-labelledby="tab-screenshot" hidden></section>
      <section role="tabpanel" id="panel-notes" aria-labelledby="tab-notes" hidden></section>
    </main>

    <div class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div class="sheet-head" data-tauri-drag-region>
        <h2 id="settings-title" data-tauri-drag-region>Settings</h2>
        <button class="icon-btn" id="settings-close" type="button" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8" /></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="update-bar" data-update-bar role="status" hidden></div>
        <section id="settings-capture"></section>
        <!-- Offline voice to text, Windows only (src/features/notes/voice-settings.ts). -->
        <section id="settings-voice" hidden></section>
        <!-- AI translation (online), only when built with the company gateway (src/translate/ai-settings.ts). -->
        <section id="settings-translate" hidden></section>
        <h3 class="sheet-section" data-icon="sliders">General</h3>
        <label class="setting">
          <span>Open HL Desk at login</span>
          <input class="switch" id="open-at-login" type="checkbox" role="switch" />
        </label>
        <div class="setting">
          <span>Welcome screen</span>
          <button class="btn" id="welcome-again" type="button">Show welcome again</button>
        </div>
        <div class="setting">
          <span class="setting-label">Updates<span class="hint" id="update-status" role="status"></span><span class="hint" id="update-last"></span></span>
          <button class="btn" id="update-check" type="button">Check now</button>
        </div>
        <div class="setting">
          <span>Open-source notices</span>
          <button class="btn" id="open-notices" type="button">Open</button>
        </div>
        <p class="setting-error" id="settings-error" role="alert" hidden></p>
        <h3 class="sheet-section" data-icon="keyboard">Shortcuts<span class="sc-hint">Click a shortcut to change it</span></h3>
        <!-- The three global shortcuts, changeable (src/shortcuts/settings.ts); the in-window keys under them. -->
        <div id="shortcut-keys"></div>
        <dl class="shortcuts" id="shortcuts"></dl>
        <div class="sc-foot"><button class="link-btn" id="shortcuts-reset" type="button" hidden>Reset all to defaults</button></div>
      </div>
      <div class="footer">
        <span id="app-version">HL Desk</span>
        <button class="btn" id="quit" type="button">Quit HL Desk</button>
      </div>
    </div>

    <!-- First-run welcome (shown until "Got it" or "Try a capture"; again from Settings or the Guide button).
         The same sheet shows "New in HL Desk" from the Updated line's What's new (src/main.ts). -->
    <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" hidden>
      <div class="welcome-body"><div class="welcome-inner">
        <!-- The tray icon's mark (scripts/make-tray-icons.mjs draws the same shapes). -->
        <svg class="welcome-logo" width="40" height="40" viewBox="0 0 16 16" aria-hidden="true">
          <rect width="16" height="16" rx="3.5" fill="#2F4CC8" />
          <path d="M2 4h2v3h2V4h2v8H6V9H4v3H2zM10 4h2v6h2v2h-4z" fill="#fff" />
        </svg>
        <h2 id="welcome-title">Welcome to HL Desk</h2>
        <p class="hint welcome-lead" id="welcome-lead"></p>
        <ul class="welcome-list" id="welcome-list"></ul>
        <p class="welcome-notes" id="welcome-notes" hidden>
          <button class="link-btn" id="welcome-release-notes" type="button">Release notes</button>
        </p>
        <!-- macOS Screen Recording card (src/features/screenshot/permission.ts). -->
        <div class="welcome-perm" id="welcome-perm" hidden></div>
      </div></div>
      <div class="footer">
        <span id="welcome-foot">Show it again in Settings</span>
        <span class="welcome-actions">
          <button class="btn" id="welcome-done" type="button">Got it</button>
          <button class="btn-primary" id="welcome-try" type="button">Try a capture</button>
        </span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
